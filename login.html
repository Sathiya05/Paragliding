<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroGlide | Pilot Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="tailwind.js"></script>
                  <link rel="icon" href="images\logo.png">


    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#3A86FF',    /* Electric Blue */
                        darkbg: '#050505',   /* Deep Black */
                        lightbg: '#F8FAFF',  /* Sky Light Blue */
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .skew-shape { transform: skewX(-12deg); }
        .unskew-shape { transform: skewX(12deg); }
        
        /* Smooth transitions for theme switching */
        * { transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* RTL margin adjustments */
        html[dir="rtl"] .ml-3 { margin-left: 0; margin-right: 0.75rem; }

        html[dir="rtl"] .fixed-toggle-container {
            right: auto !important;
            left: 1.5rem !important;
        }

        html[dir="rtl"] .mobile-logo-container {
            left: auto !important;
            right: 1.5rem !important;
        }
    </style>
</head>

<body class="bg-lightbg dark:bg-darkbg text-black dark:text-white antialiased min-h-screen overflow-x-hidden">

    <div class="fixed top-6 right-6 z-50 flex items-center gap-3 fixed-toggle-container">
        <button id="rtlToggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-[#111] shadow-lg border border-gray-200 dark:border-gray-800 text-brand font-bold text-[10px]">RTL</button>
        <button id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-[#111] shadow-lg border border-gray-200 dark:border-gray-800 text-brand">
            <i id="themeIcon" class="fas fa-moon"></i>
        </button>
    </div>

    <main class="flex h-screen overflow-hidden">
        
        <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden bg-brand">
            <img src="images\Staying Aloft Longer.webp" 
                 alt="Paraglider in mountains" class="absolute inset-0 w-full h-full object-cover ">
            
            <div class="absolute inset-0 bg-gradient-to-b from-white/80 to-brand/50"></div>
            
            <div class="relative z-10 w-full p-12 xl:p-20 flex flex-col justify-between">
              <a href="index.html" class="flex items-center gap-3 group shrink-0 relative z-[100]">
          <div class="relative flex items-center justify-center w-10 h-10 bg-[#3A86FF] rounded-xl transform transition-transform duration-300 shadow-[0_0_15px_rgba(58,134,255,0.4)]">
            <i class="fas fa-wind text-white text-xl transition-transform duration-300"></i>
          </div>
          <div class="flex flex-col">
            <span class="text-xl font-bold tracking-tighter uppercase text-black dark:text-white">
              AERO<span class="text-[#3A86FF]">GLIDE</span>
            </span>
            <span class="text-[9px] tracking-[0.3em] uppercase text-gray-500 dark:text-gray-400 font-bold leading-none mt-1">Tandem Flights</span>
          </div>
        </a>

                <div>
                    <h2 class="text-5xl xl:text-6xl font-semibold text-white leading-tight uppercase tracking-tighter mb-4">
                        Leave the <br> <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-brand">Ground</span> <br> Behind.
                    </h2>
                    <p class="text-white/80 text-lg font-medium max-w-md">Access your flight logs, media vault, and upcoming mission briefings.</p>
                </div>

                <div class="flex items-center gap-8">
                    <div class="flex flex-col">
                        <span class="text-2xl xl:text-3xl font-semibold text-white">15k+</span>
                        <span class="text-[10px] uppercase font-bold tracking-[0.2em] text-white/60">Flights Logged</span>
                    </div>
                    <div class="w-[1px] h-10 bg-white/20"></div>
                    <div class="flex flex-col">
                        <span class="text-2xl xl:text-3xl font-semibold text-white">100%</span>
                        <span class="text-[10px] uppercase font-bold tracking-[0.2em] text-white/60">Safety Record</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-1/2 flex items-center justify-center p-6 md:p-12 relative overflow-y-auto lg:overflow-hidden bg-lightbg dark:bg-darkbg">
            
            <div class="absolute top-6 left-6 lg:hidden mobile-logo-container">
                <a href="index.html" class="flex items-center gap-3 group">
                    <div class="relative flex items-center justify-center w-10 h-10 bg-[#3A86FF] rounded-xl shadow-[0_0_15px_rgba(58,134,255,0.4)]">
                        <i class="fas fa-wind text-white text-xl"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xl font-bold tracking-tighter uppercase text-black dark:text-white">
                            AERO<span class="text-[#3A86FF]">GLIDE</span>
                        </span>
                        <span class="text-[9px] tracking-[0.3em] uppercase text-gray-500 dark:text-gray-400 font-bold leading-none mt-1">Tandem Flights</span>
                    </div>
                </a>
            </div>

            <div class="w-full max-w-md space-y-6 md:space-y-8">
                <div class="text-center lg:text-left">
                    <h1 class="text-3xl md:text-4xl font-semibold uppercase tracking-tighter mb-2">Welcome <span class="text-brand">Back.</span></h1>
                    <p class="text-gray-500 dark:text-gray-400 font-medium text-sm">Ready for your next launch window?</p>
                </div>



                <form class="space-y-4 md:space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-[9px] font-bold uppercase tracking-[0.2em] text-gray-400 ml-1">Pilot ID / Email</label>
                        <div class="relative group">
                            <i class="fas fa-user-astronaut absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-brand transition-colors"></i>
                            <input type="email" placeholder="name@aeroglide.com" 
                                   class="w-full pl-14 pr-6 py-4 bg-white dark:bg-[#0a0a0a] border-2 border-gray-100 dark:border-gray-900 rounded-2xl outline-none focus:border-brand transition-all font-medium text-sm">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <div class="flex justify-between items-center px-1">
                            <label class="text-[9px] font-bold uppercase tracking-[0.2em] text-gray-400">Password</label>
                        </div>
                        <div class="relative group">
                            <i class="fas fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-brand transition-colors"></i>
                            <input type="password" id="password" placeholder="••••••••" 
                                   class="w-full pl-14 pr-12 py-4 bg-white dark:bg-[#0a0a0a] border-2 border-gray-100 dark:border-gray-900 rounded-2xl outline-none focus:border-brand transition-all font-medium text-sm">
                            <button type="button" id="togglePassword" class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-brand transition-colors focus:outline-none">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between px-1">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="remember" class="w-4 h-4 rounded accent-brand">
                            <label for="remember" class="text-xs font-bold text-gray-500 uppercase tracking-widest cursor-pointer">Remember Me</label>
                        </div>
                        <a href="#" class="text-[10px] font-bold uppercase text-brand hover:underline">Forgot Password?</a>
                    </div>

                    <button type="submit" class="rounded-xl w-full py-4 bg-brand text-white font-semibold text-sm uppercase tracking-[0.2em] shadow-[0_0_20px_rgba(58,134,255,0.4)] hover:bg-black dark:hover:bg-white dark:hover:text-black transition-all group">
                        <div class=" flex items-center justify-center gap-3">
                            Log In <i class="fas fa-paper-plane group-hover:translate-x-2 group-hover:-translate-y-1 transition-transform"></i>
                        </div>
                    </button>
                </form>

               

                <div class="relative py-2 flex items-center justify-center">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200 dark:border-gray-800"></div></div>
                    <span class="relative bg-lightbg dark:bg-darkbg px-4 text-[9px] font-bold text-gray-400 uppercase tracking-[0.3em]">External Sync</span>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center gap-3 py-3 bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 rounded-2xl hover:border-brand transition-all">
                        <i class="fab fa-google text-brand"></i>
                        <span class="text-[10px] font-bold uppercase tracking-widest">Google</span>
                    </button>
                    <button class="flex items-center justify-center gap-3 py-3 bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 rounded-2xl hover:border-brand transition-all">
                        <i class="fab fa-apple text-black dark:text-white"></i>
                        <span class="text-[10px] font-bold uppercase tracking-widest">Apple</span>
                    </button>
                </div>
                 <p class="text-center text-[10px] font-bold uppercase tracking-widest text-gray-500 dark:text-gray-400">
                    New to AeroGlide? 
                    <a href="signup.html" class="text-brand hover:underline ms-1">Sign Up</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        // Theme Toggle Logic
        const themeBtn = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");
        const html = document.documentElement;

        themeBtn.addEventListener('click', () => {
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('aeroglide-dark', isDark);
            themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        });

        // Initialize Theme from Storage
        if (localStorage.getItem('aeroglide-dark') === 'true') {
            html.classList.add('dark');
            themeIcon.className = 'fas fa-sun';
        }

        // RTL Toggle Logic
        const rtlBtn = document.getElementById("rtlToggle");
        rtlBtn.addEventListener('click', () => {
            const currentDir = html.getAttribute("dir");
            html.setAttribute("dir", currentDir === "rtl" ? "ltr" : "rtl");
        });

        // Password Toggle Logic
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });
    </script>
</body>
</html>
